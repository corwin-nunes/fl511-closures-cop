<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FL511 closure GeoJSON prototype</title>
<style>body{font:1rem system-ui,sans-serif;line-height:1.6;max-width:700px;margin:3em auto;padding:0 1em} code{background:#eee;padding:.1em .3em} .notice{border-left:3px solid #cc6b23;padding-left:1em}</style></head>
<body><h1>FL511 closure GeoJSON prototype</h1>
<p class="notice"><strong>Not for sole use in emergency routing.</strong> Independent prototype. Check timestamps and confirm critical closures with <a href="https://www.fl511.com/map">FL511</a> and local authorities. Not affiliated with FDOT.</p>
<p><a href="closures.geojson">ArcGIS GeoJSON feed</a> · <a href="status.json">Update status</a></p>
<div id="status">Loading update status...</div>
<script>fetch('status.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(s=>{
 document.getElementById('status').textContent=`Retrieved: ${s.retrieved_at_utc}; mapped closure points: ${s.mapped_closure_points}; unmatched: ${s.unmapped_closure_events}.`;
}).catch(()=>document.getElementById('status').textContent='No successful data retrieval yet.');</script>
</body></html>
